[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding for small language models"
requires-python = ">=3.10"
dependencies = [
    "llm_sdk",
    "numpy",
    "pydantic",
    "mypy",
    "flake8",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
